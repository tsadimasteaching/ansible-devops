---
# Εγκατάσταση Docker.
#   ansible-playbook -l frontend-vm playbooks/docker.yaml
#
# Τα tasks είναι στο tasks/install-docker.yaml, ώστε να τα ξαναχρησιμοποιούν κι άλλα playbooks.
- name: Install docker
  hosts: all

  tasks:
    # import_tasks: τα tasks "μπαίνουν" εδώ όταν διαβάζεται το playbook (static)
    - name: Install docker engine
      ansible.builtin.import_tasks: tasks/install-docker.yaml
