---
# Spring + Vue + PostgreSQL με docker compose (docker-compose.yaml του spring repo).
#
#   ansible-playbook -l <appserver> playbooks/spring-vue-docker.yaml
#
# Οι containers ανοίγουν τις πόρτες 5432, 8080 και 9000: τρέξ' το σε host όπου
# ΔΕΝ τρέχουν ήδη το spring.yaml / postgres.yaml (π.χ. ένα καινούργιο VM).
#
# Αν δεν υπάρχει docker, εγκαθίσταται πρώτα (tasks/install-docker.yaml).
# Μεταβλητές: spring_repo_url, spring_branch, app_dir, app_env (group_vars/appservers.yaml)
- name: Deploy spring and vue with docker compose
  hosts: appservers

  tasks:
    - name: Check if docker and docker compose are installed
      ansible.builtin.command: docker compose version
      register: docker_version_result
      changed_when: false
      failed_when: false          # δεν είναι λάθος να λείπει, απλώς το εγκαθιστούμε

    # include_tasks: τα tasks φορτώνονται την ώρα της εκτέλεσης (dynamic),
    # οπότε μπορούμε να τα τρέξουμε υπό συνθήκη με when
    - name: Install docker if it is missing
      ansible.builtin.include_tasks: tasks/install-docker.yaml
      when: docker_version_result.rc != 0

    - name: Clone the Spring repository
      ansible.builtin.git:
        repo: "{{ spring_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ spring_branch }}"
        force: true

    - name: Populate application.properties
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/src/main/resources/application.properties"
        regexp: "^{{ item.key | regex_escape }}="
        line: "{{ item.key }}={{ item.value }}"
      loop: "{{ app_env | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Tear down existing services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: absent

    - name: Create and start services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present
      register: output

    - name: Show the containers
      ansible.builtin.debug:
        msg: "{{ output.containers | map(attribute='Name') | list }}"
