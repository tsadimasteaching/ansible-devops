---
# Εγκατάσταση PostgreSQL και δημιουργία βάσης + χρήστη για την εφαρμογή.
#
# Εκτέλεση:
#   ansible-playbook -l dbserver-vm playbooks/postgres.yaml
#
# Μεταβλητές:
#   group_vars/all.yaml:        db.name, db.user, db.password
#   group_vars/dbservers.yaml:  postgres_version (από την έκδοση του Ubuntu),
#                               postgres_conf_dir, db_allowed_cidr

- name: Install PostgreSQL and create the application database
  hosts: dbservers
  become: true

  pre_tasks:
    # Το postgres_version βγαίνει από το map postgres_versions (group_vars/dbservers.yaml).
    # Αν η έκδοση του Ubuntu δεν υπάρχει εκεί, σταμάτα με καθαρό μήνυμα.
    - name: Check that the Ubuntu version is supported
      ansible.builtin.assert:
        that: ansible_facts['distribution_version'] in postgres_versions
        fail_msg: >-
          Ubuntu {{ ansible_facts['distribution_version'] }} is not in postgres_versions
          (supported: {{ postgres_versions.keys() | join(', ') }})
        success_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} -> PostgreSQL {{ postgres_version }}"

    - name: Install PostgreSQL and psycopg2 (needed by the community.postgresql modules)
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

  tasks:
    # Στο Ubuntu η βάση αρχικοποιείται αυτόματα με την εγκατάσταση του πακέτου
    - name: Start and enable postgresql
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Create db user
      community.postgresql.postgresql_user:
        name: "{{ db.user }}"
        password: "{{ db.password }}"
        state: present
      become_user: postgres

    # Από την PostgreSQL 15 μόνο ο owner της βάσης μπορεί να φτιάχνει πίνακες
    # στο public schema, γι' αυτό ο χρήστης της εφαρμογής γίνεται owner.
    - name: Create app database
      community.postgresql.postgresql_db:
        name: "{{ db.name }}"
        owner: "{{ db.user }}"
        state: present
      become_user: postgres

    - name: Allow password (md5) connections for the db user from {{ db_allowed_cidr }}
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgres_conf_dir }}/pg_hba.conf"
        contype: host
        databases: "{{ db.name }}"
        users: "{{ db.user }}"
        source: "{{ db_allowed_cidr }}"
        method: md5
      become_user: postgres
      notify: restart postgres

    - name: Listen on all network interfaces
      ansible.builtin.lineinfile:
        path: "{{ postgres_conf_dir }}/postgresql.conf"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '*'"
      become_user: postgres
      notify: restart postgres

  handlers:
    - name: restart postgres
      ansible.builtin.service:
        name: postgresql
        state: restarted
