---
# Build ενός Vue.js frontend και σερβίρισμα από nginx.
# Το nginx προωθεί τα /api, /student, /course στον spring backend (files/nginx.vue.j2).
#
#   ansible-playbook playbooks/vuejs.yaml                 # όλοι οι frontservers
#   ansible-playbook -l frontend-vm playbooks/vuejs.yaml  # μόνο ένας
#
# Μεταβλητές (group_vars/frontservers.yaml, app_port: group_vars/all.yaml):
#   frontend_repo_url, frontend_branch, frontend_dir, frontend_site_dir,
#   nvm_version, node_version, frontend_env (-> .env.local), backend_server_url (-> nginx)
- name: Build and deploy the Vue.js frontend
  hosts: frontservers

  vars:
    # εδώ εγκαθιστά το node το nvm
    node_bin_dir: "{{ ansible_user_dir }}/.nvm/versions/node/v{{ node_version }}/bin"

  pre_tasks:
    - name: Install nginx and git
      ansible.builtin.apt:
        name:
          - nginx
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    # creates: αν υπάρχει ήδη το αρχείο, το task δεν ξανατρέχει (idempotent shell)
    - name: Install nvm {{ nvm_version }}
      ansible.builtin.shell: >-
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_user_dir }}/.nvm/nvm.sh"

    - name: Install node {{ node_version }}
      ansible.builtin.shell: source ~/.nvm/nvm.sh && nvm install {{ node_version }}
      args:
        executable: /bin/bash
        creates: "{{ node_bin_dir }}"

  tasks:
    - name: Clone the Vue repository
      ansible.builtin.git:
        repo: "{{ frontend_repo_url }}"
        dest: "{{ frontend_dir }}"
        version: "{{ frontend_branch }}"
        force: true
      register: frontend_repo

    # Το .env είναι μέσα στο git: αν το αλλάζαμε, το git module (force: true) θα το
    # επανέφερε σε κάθε εκτέλεση. Το Vite διαβάζει και το .env.local, με μεγαλύτερη
    # προτεραιότητα, και αυτό είναι στο .gitignore. Γράφουμε λοιπόν εκεί.
    - name: Populate .env.local
      ansible.builtin.lineinfile:
        path: "{{ frontend_dir }}/.env.local"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}='{{ item.value }}'"
        create: true
        mode: "0644"
      loop: "{{ frontend_env | dict2items }}"
      register: frontend_dotenv

    # environment: μεταβλητές περιβάλλοντος μόνο για αυτό το task.
    # Το build ξανατρέχει μόνο αν άλλαξε ο κώδικας ή το .env.local, ή αν δεν υπάρχει dist/.
    - name: Check if the frontend has been built
      ansible.builtin.stat:
        path: "{{ frontend_dir }}/dist/index.html"
      register: frontend_dist

    - name: Install dependencies and build
      ansible.builtin.shell: npm install && npm run build
      args:
        chdir: "{{ frontend_dir }}"
      environment:
        PATH: "{{ node_bin_dir }}:{{ ansible_env.PATH }}"
      when: frontend_repo.changed or frontend_dotenv.changed or not frontend_dist.stat.exists

    - name: Copy dist to the nginx site directory
      ansible.builtin.copy:
        src: "{{ frontend_dir }}/dist/"
        dest: "{{ frontend_site_dir }}"
        remote_src: true
        owner: www-data
        group: www-data
        mode: "u=rwX,g=rX,o=rX"   # X: execute μόνο στους φακέλους
      become: true

    - name: Copy nginx conf file
      ansible.builtin.template:
        src: ../files/nginx.vue.j2
        dest: /etc/nginx/sites-available/vue
        mode: "0644"
      become: true
      notify: reload nginx

    - name: Enable vue site in nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/vue
        dest: /etc/nginx/sites-enabled/vue
        state: link
      become: true
      notify: reload nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      notify: reload nginx

    - name: Apply pending nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Check that the site responds
      ansible.builtin.uri:
        url: http://localhost/

  handlers:
    # πρώτα έλεγχος σύνταξης (nginx -t) και μετά reload
    - name: reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      become: true
